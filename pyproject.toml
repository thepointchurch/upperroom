[project]
name = "upperroom"
version = "3.3.5"
description = "A website for Churches."
license = "GPL-2.0-only"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [
    {name = "Craig Holyoak", email = "craig@helmsdeep.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "argon2-cffi (>=25.1.0)",
    "bcrypt (>=5.0.0)",
    "bleach (>=6.4.0)",
    "django (>=6.1,<6.2.0)",
    "django-environ (>=0.14.0)",
    "django-markdownify (>=0.9.7)",
    "django-robots (>=6.1)",
    "mutagen (>=1.48.0)",
    "PyYAML (>=6.0.3)",
    "uWSGI (>=2.0.31)",
    "uwsgi-tools (>=1.1.1)",
    "weasyprint (>=70.0)",
    "yafg (>=0.4)",
]

[project.urls]
homepage = "https://github.com/thepointchurch/upperroom"
repository = "https://github.com/thepointchurch/upperroom"

[project.scripts]
upperroom = "upperroom.commands:main"
upperroom-sendrosteremails = "upperroom.commands:sendrosteremails"
upperroom-restore-fixtures = "upperroom.commands:restore_fixtures"

[project.optional-dependencies]
aws = [
    "cryptography>=50.0.2",
    "django-ses>=4.9.0",
    "django-storages>=1.14.6",
]
cache = [
    "django-cacheops>=7.2",
    "django-redis>=7.0.0",
]
google = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
]
pgsql = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "django-debug-toolbar>=8,<9",
    "gitpython>=3,<4",
    "pre-commit>=4,<5",
    "pylint>=4,<5",
    "pylint-django>=2.8,<3",
    "pytest>=9,<10",
    "pytest-django>=4,<5",
    "ruff>=0.17.3",
    "semantic_version>=2,<3",
    "tomlkit>=0,<1",
    "ty>=0.0.95",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "**/tests.py",
    "**/tests",
]
wheel-exclude = [
    "**/tests.py",
    "**/tests",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[tool.pylint.master]
jobs = 0
load-plugins = [
    "pylint_django",
]
django-settings-module = "upperroom.settings"

[tool.pylint.format]
max-line-length = 119

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",
]

[tool.pylint.variables]
ignored-argument-names = "kwargs|args"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
DJANGO_SETTINGS_MODULE = "upperroom.settings"
python_files = "tests.py tests/*.py"


[tool.pylsp-mypy]
enabled = false


[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = [
    "RUF012",
    "RUF100",
]


[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
no-matching-overload = "ignore"
possibly-missing-submodule = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
